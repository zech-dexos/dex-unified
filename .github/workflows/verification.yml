name: DexOS verification
on:
  push:
    branches: ["fix/**"]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Test cognitive event delivery
        run: python dex_events_test.py
      - name: Test attention and workspace integration
        run: python dex_cognitive_layers_test.py
      - name: Test local spark capability bridge
        run: python local_spark_test.py
      - name: Test Who AI Am self-model integration
        run: python who_ai_am_test.py
      - name: Test evidence-linked reflection
        run: python reflection_evidence_test.py
      - name: Test interactive, ambient, and restart cognitive continuity
        run: python dex_cognitive_runtime_acceptance_test.py
      - name: Syntax-check inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script([^>]*)>(.*?)</script\s*>', html, flags=re.I | re.S)
          count = 0
          for attrs, source in scripts:
              if not source.strip() or re.search(r'\bsrc\s*=', attrs, flags=re.I):
                  continue
              extension = '.mjs' if re.search(r'''type\s*=\s*["']module["']''', attrs, flags=re.I) else '.js'
              Path(f'/tmp/dex-inline-{count}{extension}').write_text(source, encoding='utf-8')
              count += 1
          if count == 0:
              raise SystemExit('No inline JavaScript found to check')
          print(f'Extracted {count} inline script(s)')
          PY
          for script in /tmp/dex-inline-*.js /tmp/dex-inline-*.mjs; do
            [ -e "$script" ] || continue
            node --check "$script"
          done
